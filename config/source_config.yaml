schema_version: 1
# CIQ is the small public Greenhouse board used for the CareerOS smoke test.
greenhouse:
  enabled: true
  boards:
    - ciq
# Disabled examples for configuring additional platforms.
lever:
  enabled: false
  sites:
    - example-company
ashby:
  enabled: false
  boards:
    - example-company
collection:
  request_timeout_seconds: 20
  user_agent: CareerOS/0.2 personal-job-research (+https://tayyabautomates.com)
  max_retries: 2
  backoff_seconds: 0.5
  max_concurrency: 2
  max_response_bytes: 5000000
