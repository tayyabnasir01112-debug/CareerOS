name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAREEROS_ENVIRONMENT: test
      CAREEROS_DATABASE_URL: sqlite+aiosqlite:///./careeros-ci.db
      CAREEROS_LOG_LEVEL: WARNING

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Scan tracked files for common secrets
        run: python -m scripts.scan_secrets

      - name: Verify Ruff formatting
        run: python -m ruff format --check .

      - name: Run Ruff linting
        run: python -m ruff check .

      - name: Run strict Mypy
        run: python -m mypy app scripts tests

      - name: Initialize isolated SQLite database
        run: python -m scripts.init_db

      - name: Run complete test suite
        run: python -m pytest
